<!doctype html>
<html ⚡>

<head>
    <meta charset="utf-8">
    <title>My AMP Page</title>
    <link rel="canonical" href="self.html" />
    <meta name="viewport" content="width=device-width" />
    <script async custom-element="amp-bind" src="https://cdn.ampproject.org/v0/amp-bind-0.1.js">
    </script>
    <style amp-boilerplate>
        body {
            -webkit-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
            -moz-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
            -ms-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
            animation: -amp-start 8s steps(1, end) 0s 1 normal both
        }

        @-webkit-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @-moz-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @-ms-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @-o-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }

        
        }
    </style><noscript>
        <style amp-boilerplate>
            body {
                -webkit-animation: none;
                -moz-animation: none;
                -ms-animation: none;
                animation: none
            }
        </style>
    </noscript>
<amp-state id="cart">
    <script type="application/json">
        {
            "quantity": 1,
            "unitPrice": 125.99
        }
    </script>
</amp-state>
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <style amp-custom>
        body {
            visibility: hidden
        }

        table,
        td {
            border-collapse: collapse;
            padding: 0;
        }

        amp-img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: aliceblue;
            padding-bottom: 40px;
        }

        .email-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            color: #3a3a3a;
            background-color: #f2f2f2;
            font-family: sans-serif, 'poppins';
            border-spacing: 0;
        }

        .nav-container {
            text-align: center;
            font-size: 0;
        }


        .nav-container .nav-item {
            display: inline-block;
            vertical-align: middle;
            width: 100%;
            max-width: 300px;
            font-size: 16px;
        }

        .hero-container {
            background-image: url("https://res.cloudinary.com/qyksrgfe/image/upload/v1793499911/amp-hero-bg_tcxlji.png");
            background-repeat: no-repeat;
            background-size: cover;
            color: #ffffff;
        }

        .hero-container {
            -size: 0;
        }

        .hero-container .hero-column {
            width: 100%;
            max-width: 296px;
            display: inline-block;
            vertical-align: middle;
        }

        .hero-container .hero-content {
            font-size: 16px;
        }

        .hero-padding {
            padding: 12px 50px;
        }

        .cart-section {
            font-size: 0;
        }

        .cart-section .cart-column {
            display: inline-block;
            vertical-align: middle;
            max-width: 300px;
            width: 100%;
            font-size: 22px;
            font-weight: 500;
        }

    .cart-items {
        font-size: 0;
        white-space: nowrap;
    }

    .cart-items .cart-items-container {
        max-width: 200px;
        width: 100%;
        display: inline-block;
        vertical-align: middle;
    }

    .cart-items .cart-items-content {
        font-size: 16px;
        width: 100%;
    }

    </style>
</head>

<body>
    <center class="wrapper">
        <table class="email-container" style="background-color: #f2f2f2;">

            <!-- Navigation -->
            <tr>
                <td>
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">

                        <tr>
                            <td class="nav-container" style="padding: 12px 0px;">

                                <table class="nav-item">
                                    <tr>
                                        <td class="nav-padding" style="padding: 10px 14px 0;">

                                            <table class="nav-content">
                                                <tr>
                                                    <td>
                                                        <a href="https://phosphoricons.com/"
                                                            style="text-decoration: none; color: #3a3a3a;">
                                                            <amp-img alt="A view of the sea"
                                                                src="https://res.cloudinary.com/qyksrgfe/image/upload/v1793493629/amp-logo_izcyul.png"
                                                                width="1.33" height="1" layout="responsive" style="width: 26px; height: auto;
                                                                display: inline-block;
                                                                vertical-align: middle;
                                                                ">
                                                            </amp-img>
                                                            <p
                                                                style="font-size: 16px; display: inline-block; vertical-align: middle; margin: 0; text-align: right;">
                                                                gadget <span>HUB</span></p>
                                                        </a>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>

                                <table class="nav-item">
                                    <tr>
                                        <td class="nav-padding" style="padding: 10px 14px 0;">
                                            <table class="nav-content">
                                                <tr>
                                                    <td>
                                                        <p style="margin: 0;">
                                                            SMART TECH BETTER LIVING
                                                        </p>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>


                    </table>
                </td>
            </tr>

            <!-- Hero Section -->
            <tr>
                <td>
                    <table width="100%" role="presentation">

                        <tr>
                            <td class="hero-container">
                                <table class="hero-column">
                                    <tr>
                                        <td class="hero-padding">
                                            <table class="hero-content">
                                                <tr>
                                                    <td>
                                                        <p style="text-transform: uppercase;
                                                             font-size: 12px;
                                                        ">
                                                            you left something behind</p>
                                                        <h1 style="margin: 14px 0;">
                                                        Your cart is waiting</h1>
                                                        <p>look like you didn’t get a chance to complete your order,your favorite
                                                       items are here and ready where are!</p>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td>
                                                        <table border="0" cellpadding="0" cellspacing="0"
                                                            role="presentation"
                                                            style="border-collapse:separate;line-height:100%;">
                                                            <tr>
                                                                <td>
                                                                 <div>
                                                                <!--[if mso]> <v:roundrect xmlns_v="urn:schemas-microsoft-com:vml" xmlns_w="urn:schemas-microsoft-com:office:word" href="https://www.activecampaign.com" style="height:40px;v-text-anchor:middle;width:130px;" arcsize="5%" strokecolor="#0088FF" fillcolor="#0088FF;width: 130;"> <w:anchorlock/> <center style="color:#ffffff;font-family:Helvetica, sans-serif;font-size:18px; font-weight: 500;">Click here!</center> </v:roundrect> <![endif]-->
                                                                  <a href="https://www.activecampaign.com"
                                                                style="display: inline-block; mso-hide:all; background-color: #0088FF; color: #FFFFFF; border:1px solid #0088FF; border-radius: 6px; line-height: 220%; width: 200px; font-family: Helvetica, sans-serif; font-size:18px; font-weight:500; text-align: center; text-decoration: none; -webkit-text-size-adjust:none; "
                                                                target="_blank">Complete Your Order</a> </a>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>

                                <table class="hero-column">
                                    <tr>
                                        <td class="hero-padding">
                                            <table class="hero-content">
                                                <tr>
                                                    <td>
                                                        <amp-img alt="A head Phone"
                                                            src="https://res.cloudinary.com/qyksrgfe/image/upload/v1793501568/headphone_l0njkk.png"
                                                            width="250" height="250" layout="responsive" style="display: block;
                                                        width: 250px; height: auto;
                                                        ">
                                                        </amp-img>

                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td>
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                        <tr>
                            <td class="cart-section">
                                <table class="cart-column">
                                    <tr>
                                        <td class="cart-padding" style="padding-left: 40px;">
                                           <table class="cart-content">
                                            <tr>
                                                <td>
                                            <p>Your cart</p>
                                                </td>
                                            </tr>
                                           </table>
                                        </td>
                                    </tr>
                                </table>

                                <table class="cart-column" role="presentation" cellpadding="0" cellspacing="0" border="0">
                                    <tr>
                                        <td class="cart-padding" style="padding-left: 150px;">
                                
                                            <table class="cart-content" role="presentation" cellpadding="0" cellspacing="0" border="0">
                                                <tr>
                                                    <!-- Cart quantity -->
                                                    <td style="vertical-align: middle; white-space: nowrap;">
                                
                                                        <p style="margin: 0; display: inline-block;
                                                            vertical-align: middle;">
                                                            <span [text]="cart.quantity">3</span>
                                                            Items
                                                        </p>
                                
                                                        <amp-img alt="Shopping cart"
                                                            src="https://res.cloudinary.com/qyksrgfe/image/upload/v1793592286/amp-cart_djfd3u.png"
                                                            width="27" height="27" layout="fixed"
                                                            style="display: inline-block; vertical-align: middle;">
                                                        </amp-img>
                                                    </td>
                                                </tr>
                                            </table>
                            
                                        </td>
                                    </tr>
                                </table>

                            
                            </td>
                        </tr>

                    </table>
                </td>
            </tr>
         <tr>
            <td>
                <table width="100%">
                
                <tr>
                <td class="cart-items">

                        <table class="cart-items-container">
                            <tr>
                                <td class="cart-items-padding">

                                    <table class="cart-items-content">
                                        <tr>
                                            <td>
                                             <amp-img
                                              alt="A view of the sea"
                                                    src="https://res.cloudinary.com/qyksrgfe/image/upload/v1789625888/Product-Image2_lmhe7f.png"
                                                    width="142"
                                                    height="115"
                                                    layout="responsive"
                                                    style="width: 140px; height: auto;">
                                             </amp-img>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                    <table class="cart-items-container">
                        <tr>
                            <td class="cart-items-padding">
                    
                                <table class="cart-items-content">
                                    <tr>
                                        <td>
                                           <h3>smart watch</h3>
                                           <p>fitness tracker Brown</p>
                                            <p>
                                                $
                                                <span [text]="(cart.quantity * cart.unitPrice).toFixed(2)">
                                                    125.99
                                                </span>
                                            </p>
                                        </td>
                                    </tr>
                                  <tr>
                                    <td>
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                        <tr>
                                            <!-- Reduce button -->
                                            <td>
                                                <button type="button" on="tap:AMP.setState({
                                                    cart: {quantity: max(0, cart.quantity - 1)}})" style="width: 35px;  height: 35px;
                                                             border: 1px solid #cccccc;
                                                              background: #ffffff;
                                                             font-size: 20px;
                                                             cursor: pointer;
                                                         ">
                                                    −
                                                </button>
                                            </td>
                                    
                                            <!-- Quantity -->
                                            <td style="
                                                      padding: 0 15px;
                                                    text-align: center;
                                                     font-size: 16px;
                                                    ">
                                                <span [text]="cart.quantity">
                                                    1
                                                </span>
                                            </td>
                                    
                                            <!-- Add button -->
                                            <td>
                                                <button type="button" on="tap:AMP.setState({  cart: { quantity: cart.quantity + 1
                                                   })" style="  width: 35px;
                                                             height: 35px;
                                                            border: 1px solid #cccccc;
                                                             background: #ffffff;
                                                             font-size: 20px;
                                                             cursor: pointer;
                                                         ">
                                                    +
                                                </button>
                                            </td>
                                        </tr>
                                    </table>
                                    </td>
                                  </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                 
                    <table class="cart-items-container">
                        <tr>
                            <td class="cart-items-padding">
                                <table class="cart-items-content">
                                    <tr>
                                        <td>
                                            <p>Cancel</p>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
                </tr>

                </table>
            </td>
         </tr>

        </table>
    </center>
</body>
</html>
